spring.application.name=datafeeder
server.port=${PORT:8090}
spring.datasource.url=jdbc:h2:file:./data/projects
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
dashboard.cors.allowed-origin=${DASHBOARD_ORIGIN:http://localhost:8080,http://localhost:8081,http://localhost:5500,http://127.0.0.1:5500}
spring.web.resources.cache.cachecontrol.no-cache=true
