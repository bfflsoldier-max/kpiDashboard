spring.application.name=jira-dashboard
spring.config.import=optional:file:./config/local.properties
jira.url=${JIRA_URL:}
# Set JIRA_PAT in the environment or jira.token in ignored config/local.properties.
jira.token=${JIRA_PAT:}

# Force browsers to always revalidate static assets (css/js/html) so edits show up without manual cache-busting or hard refresh.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.chain.cache=false

