<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet"     href="/styles.css?v=20261010-aligned-admin-form" />
  </head>

  <body>
    <div id="loader" class="loader-overlay hidden">
      <div class="loader-wrapper">
        <div class="loader"></div>
        <div class="loader-text">Loading dashboard</div>
      </div>
    </div>
    <main class="app-shell">
      <div id="dashboardShell" class="container">
        <div class="hero-stack">
          <section class="dashboard-hero" aria-label="Dashboard Header">
            <div class="hero-brand">
              <div class="hero-app-row">
                <button
                  class="hero-menu-button"
                  type="button"
                  aria-label="Open menu"
                  aria-expanded="false"
                  aria-controls="heroNavPanel"
                  onclick="toggleHeroMenu()"
                >
                  <span></span>
                  <span></span>
                  <span></span>
                </button>
                <h1
                  class="hero-wordmark"
                  aria-label="app name"
                >
                  <span class="wordmark-light">Delivery</span
                  ><span class="wordmark-bold">360</span>
                  <button
                    class="wordmark-admin-trigger"
                    type="button"
                    aria-label="Admin access"
                    title="Click five times for admin access"
                  >
                    <span class="wordmark-symbol" aria-hidden="true">➤</span>
                  </button>
                </h1>
                <button
                  class="admin-mode-button hidden"
                  id="admin-mode-button"
                  type="button"
                  onclick="logoutAdmin()"
                >
                  Admin mode · Exit
                </button>
              </div>
              <!-- <p id="pageTitle" class="hero-title">Shared metrics. Smarter sprints</p> -->
            </div>
          </section>
          <nav
            id="heroNavPanel"
            class="hero-nav-panel hidden"
            aria-label="Main menu"
          >
            <p class="hero-nav-empty">No streams have been added yet.</p>
          </nav>
        </div>
        <p
          id="dashboard-status"
          class="dashboard-status hidden"
          role="status"
          aria-live="polite"
        ></p>
        <section
          id="selectedProjectContext"
          class="selected-project-context hidden"
          aria-labelledby="selectedProjectTitle"
        >
          <div>
            <p class="selected-project-label" id="selectedProjectLabel">
              Project
            </p>
            <h2 id="selectedProjectTitle"></h2>
          </div>
        </section>
        <section
          id="overviewSection"
          class="overview-section"
          aria-labelledby="overviewTitle"
        >
          <p class="overview-eyebrow">Overview</p>
          <h2 id="overviewTitle">No dashboards configured yet</h2>
          <p id="overviewDescription" class="hidden"></p>
          <p id="overviewMessage">
            Add a stream, project name, and domain in the Data Feeder to get
            started.
          </p>
        </section>
        <div id="userSection" class="user-section">
          <div id="kpiSections"></div>
        </div>
      </div>
    </main>
    <dialog id="admin-login-dialog" class="admin-login-dialog">
      <form id="admin-login-form" class="admin-login-form">
        <button
          class="admin-dialog-close"
          type="button"
          aria-label="Close admin login"
          onclick="closeAdminLogin()"
        >
          ×
        </button>
        <h2>Admin access</h2>
        <label class="admin-login-field">
          <span>Username</span>
          <input name="username" autocomplete="username" required />
        </label>
        <label class="admin-login-field">
          <span>Password</span>
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <p
          id="admin-login-status"
          class="admin-login-status"
          role="status"
          aria-live="polite"
        ></p>
        <button class="admin-login-submit" type="submit">Log in</button>
      </form>
    </dialog>
    <footer class="page-footer">
      <p>Engineered by Aswin R Asok</p>
    </footer>
    <script src="/js/config.js?v=20261009-stream-hierarchy" defer></script>
    <script src="/js/dashboard.js?v=20261010-clear-admin-credentials" defer></script>
  </body>
</html>
